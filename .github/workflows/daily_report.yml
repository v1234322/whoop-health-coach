name: WHOOP Daily Report

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

  workflow_dispatch:


jobs:

  run-report:

    runs-on: ubuntu-latest

    steps:

      - name: Call WHOOP Auto Report

        run: |
          curl --fail \
               --show-error \
               --retry 3 \
               --retry-delay 10 \
               --retry-all-errors \
               --max-time 180 \
               -H "Authorization: Bearer ${{ secrets.CHATGPT_ACTION_API_KEY }}" \
               https://whoop-health-coach.onrender.com/whoop/auto-report
