name: Daily WHOOP Report

on:
  workflow_dispatch:

  schedule:
    # 北京时间每天 08:00 = UTC 00:00
    - cron: "0 0 * * *"

jobs:
  run-whoop:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render WHOOP Report
        run: |
          echo "Triggering Render WHOOP report..."

          curl -f \
            --max-time 120 \
            https://whoop-health-coach.onrender.com/whoop/auto-report

          echo ""
          echo "Render WHOOP report finished."
