name: Daily WHOOP Report

on:
  workflow_dispatch:
  schedule:
    # 北京时间每天08:00 = UTC 00:00
    - cron: "0 0 * * *"

jobs:
  run-whoop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r whoop-health-coach/requirements.txt

      - name: Run WHOOP Coach
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python whoop-health-coach/daily_report.py
